```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VidioAI - Video Editor</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #101010;
    color: white;
    min-height: 100vh;
}

header {
    height: 65px;
    padding: 0 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #161616;
    border-bottom: 1px solid #292929;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.logo span {
    color: #8b5cf6;
}

.header-right {
    color: #aaa;
}

.container {
    max-width: 1250px;
    margin: 25px auto;
    padding: 0 20px;
}

.title {
    margin-bottom: 20px;
}

.title h1 {
    font-size: 30px;
    margin-bottom: 7px;
}

.title p {
    color: #999;
}

.editor {
    display: grid;
    grid-template-columns: 1fr 310px;
    gap: 20px;
}

.preview-section,
.controls {
    background: #191919;
    border: 1px solid #292929;
    border-radius: 12px;
    padding: 20px;
}

.preview {
    background: #050505;
    min-height: 500px;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
}

video {
    width: 100%;
    max-height: 480px;
    object-fit: contain;
}

.empty {
    text-align: center;
    color: #888;
}

.empty h2 {
    color: white;
    margin-bottom: 8px;
}

.upload-btn {
    display: inline-block;
    margin-top: 18px;
    background: #8b5cf6;
    padding: 12px 22px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.upload-btn:hover {
    background: #7442df;
}

input[type="file"] {
    display: none;
}

.text-overlay {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 32px;
    font-weight: bold;
    color: white;
    text-shadow: 2px 2px 5px black;
    display: none;
    pointer-events: none;
    text-align: center;
    width: 90%;
}

.timeline {
    margin-top: 18px;
}

.timeline-label {
    display: flex;
    justify-content: space-between;
    color: #aaa;
    font-size: 13px;
    margin-bottom: 7px;
}

.timeline input {
    width: 100%;
}

.controls h2 {
    font-size: 20px;
    margin-bottom: 20px;
}

.control {
    margin-bottom: 20px;
}

.control label {
    display: block;
    color: #aaa;
    font-size: 13px;
    margin-bottom: 8px;
}

button,
select,
input[type="text"] {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 7px;
    background: #292929;
    color: white;
}

button {
    cursor: pointer;
}

button:hover {
    background: #383838;
}

input[type="range"] {
    width: 100%;
    accent-color: #8b5cf6;
}

input[type="text"] {
    outline: none;
}

.export {
    background: #8b5cf6;
    font-weight: bold;
    margin-top: 5px;
}

.export:hover {
    background: #7442df;
}

.status {
    text-align: center;
    color: #999;
    font-size: 12px;
    margin-top: 12px;
}

@media (max-width: 850px) {
    .editor {
        grid-template-columns: 1fr;
    }

    .preview {
        min-height: 350px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        Vidio<span>AI</span>
    </div>

    <div class="header-right">
        Video Editor
    </div>
</header>


<div class="container">

    <div class="title">
        <h1>Video Editor</h1>
        <p>Upload your video and start editing.</p>
    </div>


    <div class="editor">

        <!-- VIDEO PREVIEW -->

        <div class="preview-section">

            <div class="preview" id="preview">

                <div class="empty" id="emptyScreen">

                    <h2>Upload a video</h2>

                    <p>Select a video from your computer.</p>

                    <label class="upload-btn">

                        Choose Video

                        <input
                            type="file"
                            id="videoInput"
                            accept="video/*"
                        >

                    </label>

                </div>


                <video
                    id="video"
                    controls
                    style="display:none;"
                ></video>


                <div
                    class="text-overlay"
                    id="textOverlay"
                ></div>

            </div>


            <div class="timeline">

                <div class="timeline-label">

                    <span id="currentTime">
                        0:00
                    </span>

                    <span id="duration">
                        0:00
                    </span>

                </div>

                <input
                    type="range"
                    id="timeline"
                    min="0"
                    max="100"
                    value="0"
                    step="0.01"
                >

            </div>

        </div>


        <!-- CONTROLS -->

        <div class="controls">

            <h2>Editing Tools</h2>


            <div class="control">

                <label>Playback</label>

                <button id="playButton">
                    ▶ Play / Pause
                </button>

            </div>


            <div class="control">

                <label>Trim Start</label>

                <input
                    type="range"
                    id="trimStart"
                    min="0"
                    max="100"
                    value="0"
                    step="0.1"
                >

                <div class="timeline-label">
                    <span>Start</span>
                    <span id="startValue">0.0s</span>
                </div>

            </div>


            <div class="control">

                <label>Trim End</label>

                <input
                    type="range"
                    id="trimEnd"
                    min="0"
                    max="100"
                    value="100"
                    step="0.1"
                >

                <div class="timeline-label">
                    <span>End</span>
                    <span id="endValue">0.0s</span>
                </div>

            </div>


            <div class="control">

                <label>Volume</label>

                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    value="1"
                    step="0.01"
                >

            </div>


            <div class="control">

                <button id="muteButton">
                    🔇 Mute / Unmute
                </button>

            </div>


            <div class="control">

                <label>Speed</label>

                <select id="speed">

                    <option value="0.5">0.5x</option>
                    <option value="0.75">0.75x</option>
                    <option value="1" selected>1x</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2x</option>

                </select>

            </div>


            <div class="control">

                <label>Brightness</label>

                <input
                    type="range"
                    id="brightness"
                    min="50"
                    max="150"
                    value="100"
                >

            </div>


            <div class="control">

                <label>Contrast</label>

                <input
                    type="range"
                    id="contrast"
                    min="50"
                    max="150"
                    value="100"
                >

            </div>


            <div class="control">

                <label>Saturation</label>

                <input
                    type="range"
                    id="saturation"
                    min="0"
                    max="200"
                    value="100"
                >

            </div>


            <div class="control">

                <label>Video Format</label>

                <select id="aspectRatio">

                    <option value="16/9">
                        YouTube - 16:9
                    </option>

                    <option value="9/16">
                        Reels / Shorts - 9:16
                    </option>

                    <option value="1/1">
                        Square - 1:1
                    </option>

                </select>

            </div>


            <div class="control">

                <label>Add Text</label>

                <input
                    type="text"
                    id="textInput"
                    placeholder="Type text..."
                >

            </div>


            <div class="control">

                <button id="textButton">
                    📝 Show / Hide Text
                </button>

            </div>


            <button
                class="export"
                id="exportButton"
            >
                ⬇ Export Video
            </button>


            <div
                class="status"
                id="status"
            >
                Upload a video to begin.

            </div>

        </div>

    </div>

</div>


<script>

const videoInput =
    document.getElementById("videoInput");

const video =
    document.getElementById("video");

const emptyScreen =
    document.getElementById("emptyScreen");

const timeline =
    document.getElementById("timeline");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const trimStart =
    document.getElementById("trimStart");

const trimEnd =
    document.getElementById("trimEnd");

const startValue =
    document.getElementById("startValue");

const endValue =
    document.getElementById("endValue");

const volume =
    document.getElementById("volume");

const speed =
    document.getElementById("speed");

const brightness =
    document.getElementById("brightness");

const contrast =
    document.getElementById("contrast");

const saturation =
    document.getElementById("saturation");

const aspectRatio =
    document.getElementById("aspectRatio");

const textInput =
    document.getElementById("textInput");

const textOverlay =
    document.getElementById("textOverlay");

const preview =
    document.getElementById("preview");

const status =
    document.getElementById("status");

const playButton =
    document.getElementById("playButton");

const muteButton =
    document.getElementById("muteButton");

const textButton =
    document.getElementById("textButton");

const exportButton =
    document.getElementById("exportButton");


let videoURL = null;


/* UPLOAD */

videoInput.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;

    if (videoURL) {
        URL.revokeObjectURL(videoURL);
    }

    videoURL =
        URL.createObjectURL(file);

    video.src = videoURL;

    emptyScreen.style.display =
        "none";

    video.style.display =
        "block";

    status.textContent =
        "Video loaded successfully.";

});


/* VIDEO INFORMATION */

video.addEventListener(
    "loadedmetadata",
    function () {

        const d =
            video.duration;

        timeline.max = d;

        trimStart.max = d;

        trimEnd.max = d;

        trimEnd.value = d;

        duration.textContent =
            formatTime(d);

        endValue.textContent =
            d.toFixed(1) + "s";

    }
);


/* FORMAT TIME */

function formatTime(seconds) {

    if (
        !seconds ||
        isNaN(seconds)
    ) {
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secondsPart =
        Math.floor(seconds % 60);

    return (
        minutes +
        ":" +
        String(secondsPart).padStart(2, "0")
    );

}


/* PLAY */

playButton.addEventListener(
    "click",
    function () {

        if (!video.src) {

            status.textContent =
                "Upload a video first.";

            return;

        }

        if (video.paused) {

            video.play();

            playButton.textContent =
                "⏸ Pause";

        } else {

            video.pause();

            playButton.textContent =
                "▶ Play";

        }

    }
);


/* VIDEO TIME */

video.addEventListener(
    "timeupdate",
    function () {

        timeline.value =
            video.currentTime;

        currentTime.textContent =
            formatTime(video.currentTime);

        if (
            video.currentTime >=
            Number(trimEnd.value)
        ) {

            video.pause();

            playButton.textContent =
                "▶ Play";

        }

    }
);


/* TIMELINE */

timeline.addEventListener(
    "input",
    function () {

        video.currentTime =
            Number(this.value);

    }
);


/* TRIM START */

trimStart.addEventListener(
    "input",
    function () {

        let start =
            Number(this.value);

        let end =
            Number(trimEnd.value);

        if (start >= end) {

            start =
                Math.max(0, end - 0.1);

            this.value =
                start;

        }

        startValue.textContent =
            start.toFixed(1) + "s";

        video.currentTime =
            start;

    }
);


/* TRIM END */

trimEnd.addEventListener(
    "input",
    function () {

        let end =
            Number(this.value);

        let start =
            Number(trimStart.value);

        if (end <= start) {

            end =
                Math.min(
                    video.duration,
                    start + 0.1
                );

            this.value =
                end;

        }

        endValue.textContent =
            end.toFixed(1) + "s";

    }
);


/* VOLUME */

volume.addEventListener(
    "input",
    function () {

        video.volume =
            Number(this.value);

        video.muted =
            false;

    }
);


/* MUTE */

muteButton.addEventListener(
    "click",
    function () {

        video.muted =
            !video.muted;

        if (video.muted) {

            this.textContent =
                "🔊 Unmute";

        } else {

            this.textContent =
                "🔇 Mute";

        }

    }
);


/* SPEED */

speed.addEventListener(
    "change",
    function () {

        video.playbackRate =
            Number(this.value);

    }
);


/* FILTERS */

function updateFilters() {

    video.style.filter =
        "brightness(" +
        brightness.value +
        "%) " +

        "contrast(" +
        contrast.value +
        "%) " +

        "saturate(" +
        saturation.value +
        "%)";

}

brightness.addEventListener(
    "input",
    updateFilters
);

contrast.addEventListener(
    "input",
    updateFilters
);

saturation.addEventListener(
    "input",
    updateFilters
);


/* ASPECT RATIO */

aspectRatio.addEventListener(
    "change",
    function () {

        preview.style.aspectRatio =
            this.value;

    }
);


/* TEXT */

textInput.addEventListener(
    "input",
    function () {

        textOverlay.textContent =
            this.value;

    }
);


textButton.addEventListener(
    "click",
    function () {

        if (
            textOverlay.style.display ===
            "block"
        ) {

            textOverlay.style.display =
                "none";

        } else {

            textOverlay.style.display =
                "block";

        }

    }
);


/* EXPORT */

exportButton.addEventListener(
    "click",
    function () {

        if (!video.src) {

            status.textContent =
                "Please upload a video first.";

            return;

        }


        /*
         * For this first version,
         * export means downloading
         * the uploaded video.
         */

        status.textContent =
            "Preparing download...";


        const link =
            document.createElement("a");


        link.href =
            video.src;


        link.download =
            "vidioai-video.webm";


        document.body.appendChild(link);


        link.click();


        document.body.removeChild(link);


        status.textContent =
            "Download started!";


    }
);

</script>

</body>
</html>
```
